apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: strict
  namespace: h2test
spec:
  mtls:
    mode: STRICT
---
apiVersion: v1
kind: Pod
metadata:
  name: meshclient
  namespace: h2test
spec:
  containers:
    - name: meshclient
      image: "curlimages/curl:8.10.1"
      command:
        - sleep
        - 1d
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: sidecar-endpoint
  namespace: envoy-gateway-system
spec:
  routingType: Endpoint
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        pod:
          labels:
            sidecar.istio.io/inject: "true"
          annotations:
            traffic.sidecar.istio.io/includeInboundPorts: ""
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: sidecar-endpoint
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: sidecar-endpoint
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sidecar-endpoint
  namespace: envoy-gateway-system
spec:
  gatewayClassName: sidecar-endpoint
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: sidecar-service
  namespace: envoy-gateway-system
spec:
  routingType: Service
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        pod:
          labels:
            sidecar.istio.io/inject: "true"
          annotations:
            traffic.sidecar.istio.io/includeInboundPorts: ""
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: sidecar-service
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: sidecar-service
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sidecar-service
  namespace: envoy-gateway-system
spec:
  gatewayClassName: sidecar-service
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-primary
  namespace: h2test
spec:
  parentRefs:
    - name: sidecar-endpoint
      namespace: envoy-gateway-system
    - name: sidecar-service
      namespace: envoy-gateway-system
  hostnames:
    - "http-primary.example.com"
  rules:
    - filters:
        - type: URLRewrite
          urlRewrite:
            hostname: http-primary.h2test.svc.cluster.local
      backendRefs:
        - name: http-primary
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http2-primary
  namespace: h2test
spec:
  parentRefs:
    - name: sidecar-endpoint
