# EG proxy without an Istio sidecar, for comparison
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: nosidecar
  namespace: envoy-gateway-system
spec:
  routingType: Service
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: nosidecar
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: nosidecar
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: nosidecar
  namespace: envoy-gateway-system
spec:
  gatewayClassName: nosidecar
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nosidecar
  namespace: h2test
spec:
  parentRefs:
    - name: nosidecar
      namespace: envoy-gateway-system
  rules:
    - matches:
        - headers:
            - name: x-backend
              value: whereami
      backendRefs:
        - name: whereami
          port: 8000
    - matches:
        - headers:
            - name: x-backend
              value: http-remote1
      backendRefs:
        - name: http-remote1
          port: 8000
