apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-h2c
  namespace: h2test
data:
  default.conf: |
    server { listen 8080; http2 on; location / { default_type text/plain; return 200 "nginx in primary over $server_protocol\n"; } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-http-primary
  namespace: h2test
spec:
  selector:
    matchLabels:
      app: httpbin-http-primary
  template:
    metadata:
      labels:
        app: httpbin-http-primary
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-http2-primary
  namespace: h2test
spec:
  selector:
    matchLabels:
      app: httpbin-http2-primary
  template:
    metadata:
      labels:
        app: httpbin-http2-primary
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-h2c-primary
  namespace: h2test
spec:
  selector:
    matchLabels:
      app: nginx-h2c-primary
  template:
    metadata:
      labels:
        app: nginx-h2c-primary
    spec:
      containers:
        - name: nginx
          image: "nginx:1.27"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: nginx-h2c
