apiVersion: v1
kind: Service
metadata:
  name: whereami
  namespace: h2test
spec:
  selector:
    app: whereami
  ports:
    - name: http
      port: 8000
      targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: whereami
  namespace: h2test
data:
  default.conf: |
    server { listen 8080; location / { default_type text/plain; return 200 "primary $hostname\n"; } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whereami
  namespace: h2test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whereami
  template:
    metadata:
      labels:
        app: whereami
    spec:
      containers:
        - name: nginx
          image: "nginx:1.27"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: whereami
