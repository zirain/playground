# Backends in namespaces amb (ambient), amb-wp (ambient + waypoint) and sc (sidecar). Apply to cluster1.
apiVersion: v1
kind: Namespace
metadata:
  name: amb
  labels:
    istio.io/dataplane-mode: ambient
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: strict
  namespace: amb
spec:
  mtls:
    mode: STRICT
---
apiVersion: v1
kind: Service
metadata:
  name: http-c1
  namespace: amb
spec:
  selector:
    app: httpbin-http-c1
  ports:
    - name: http
      port: 8000
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: http2-c1
  namespace: amb
spec:
  selector:
    app: httpbin-http2-c1
  ports:
    - name: http2
      port: 8001
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-h2c-c1
  namespace: amb
spec:
  selector:
    app: nginx-h2c-c1
  ports:
    - name: http2
      port: 8004
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: http-c2
  namespace: amb
spec:
  selector:
    app: httpbin-http-c2
  ports:
    - name: http
      port: 8000
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: http2-c2
  namespace: amb
spec:
  selector:
    app: httpbin-http2-c2
  ports:
    - name: http2
      port: 8001
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-h2c-c2
  namespace: amb
spec:
  selector:
    app: nginx-h2c-c2
  ports:
    - name: http2
      port: 8004
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: whereami
  namespace: amb
spec:
  selector:
    app: whereami
  ports:
    - name: http
      port: 8000
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-http-c1
  namespace: amb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin-http-c1
  template:
    metadata:
      labels:
        app: httpbin-http-c1
    spec:
      containers:
        - name: app
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin-http2-c1
  namespace: amb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin-http2-c1
  template:
    metadata:
      labels:
        app: httpbin-http2-c1
    spec:
      containers:
        - name: app
          image: mccutchen/go-httpbin:v2.15.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-h2c
  namespace: amb
data:
  default.conf: |
    server { listen 8080; http2 on; location / { default_type text/plain; return 200 "nginx in c1 over $server_protocol\n"; } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-h2c-c1
  namespace: amb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-h2c-c1
  template:
    metadata:
      labels:
        app: nginx-h2c-c1
    spec:
      containers:
        - name: app
          image: nginx:1.27
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: nginx-h2c
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: whereami
  namespace: amb
data:
  default.conf: |
    server { listen 8080; location / { default_type text/plain; return 200 "c1 $hostname\n"; } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whereami
  namespace: amb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whereami
  template:
    metadata:
      labels:
        app: whereami
    spec:
      containers:
        - name: app
          image: nginx:1.27
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: whereami
---
