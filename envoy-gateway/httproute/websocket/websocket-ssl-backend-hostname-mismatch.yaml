apiVersion: v1
kind: Namespace
metadata:
  name: websocket-hostname-mismatch-demo
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: websocket-hostname-mismatch-gateway
  namespace: websocket-hostname-mismatch-demo
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
# Full nginx.conf (not a conf.d snippet) terminating TLS on 8443 and reverse-proxying
# the WebSocket upgrade to the plaintext echo server on 127.0.0.1:8080. The backend
# itself is healthy — the BackendTLSPolicy below is what's broken.
apiVersion: v1
kind: ConfigMap
metadata:
  name: websocket-tls-proxy-conf
  namespace: websocket-hostname-mismatch-demo
data:
  nginx.conf: |
    events {}
    http {
      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }

      server {
        listen 8443 ssl;

        ssl_certificate     /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;

        location / {
          proxy_pass http://127.0.0.1:8080;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $host;
          proxy_read_timeout 3600s;
          proxy_send_timeout 3600s;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: websocket-echo-tls
  namespace: websocket-hostname-mismatch-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: websocket-echo-tls
  template:
    metadata:
      labels:
        app: websocket-echo-tls
    spec:
      containers:
        # Plain WebSocket echo server, reachable only inside the pod on 127.0.0.1:8080.
        - name: websocket-echo
          image: jmalloc/echo-server:0.3.6
          ports:
            - containerPort: 8080
              name: websocket
          readinessProbe:
            tcpSocket:
              port: websocket
        # TLS-terminating sidecar: this is the "SSL backend" Envoy Gateway connects to.
        # Its cert is valid for websocket-backend-hostname-mismatch.example.com — see
        # the BackendTLSPolicy below, which checks a different hostname.
        - name: tls-proxy
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8443
              name: wss
          readinessProbe:
            tcpSocket:
              port: wss
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tls-cert
              mountPath: /etc/nginx/tls
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: websocket-tls-proxy-conf
        - name: tls-cert
          secret:
            # Created out-of-band, see README.md — must contain tls.crt/tls.key for
            # CN/SAN "websocket-backend-hostname-mismatch.example.com".
            secretName: websocket-backend-tls
---
apiVersion: v1
kind: Service
metadata:
  name: websocket-echo-tls
  namespace: websocket-hostname-mismatch-demo
spec:
  selector:
    app: websocket-echo-tls
  ports:
    - name: wss
      port: 8443
      targetPort: wss
---
# Tells Envoy Gateway to originate TLS to websocket-echo-tls:8443 and validate the
# backend's certificate against "websocket-backend.example.com". That's NOT what the
# cert's SAN says (see above) — the chain of trust is fine (the leaf cert is its own
# trust anchor), but the hostname check fails, so every upstream connection attempt
# is rejected before the WebSocket upgrade ever reaches the healthy echo server.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: websocket-backend-tls
  namespace: websocket-hostname-mismatch-demo
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: websocket-echo-tls
  validation:
    caCertificateRefs:
      - name: websocket-backend-ca
        group: ""
        kind: ConfigMap
    hostname: websocket-backend.example.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: websocket-echo-tls
  namespace: websocket-hostname-mismatch-demo
spec:
  parentRefs:
    - name: websocket-hostname-mismatch-gateway
  rules:
    - name: echo
      matches:
        - path:
            type: PathPrefix
            value: /echo
      backendRefs:
        - name: websocket-echo-tls
          port: 8443
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: websocket-echo-tls
          port: 8443
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: btp-for-route-tls
  namespace: websocket-hostname-mismatch-demo
spec:
  circuitBreaker:
    maxConnections: 1000000
    maxParallelRequests: 1000000
    maxParallelRetries: 1000000
    maxPendingRequests: 100000
    maxRequestsPerConnection: 1000000
  httpUpgrade:
    - type: websocket
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: websocket-echo-tls
  timeout:
    http:
      connectionIdleTimeout: 600s
    tcp:
      connectTimeout: 10000ms
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: btp-for-routerule-tls
  namespace: websocket-hostname-mismatch-demo
spec:
  circuitBreaker:
    maxConnections: 1000000
    maxParallelRequests: 1000000
    maxParallelRetries: 1000000
    maxPendingRequests: 100000
    maxRequestsPerConnection: 1000000
  httpUpgrade:
    - type: websocket
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: websocket-echo-tls
      sectionName: echo
  timeout:
    http:
      connectionIdleTimeout: 1000s
    tcp:
      connectTimeout: 10000ms
