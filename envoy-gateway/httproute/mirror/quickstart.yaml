# export GTW_IP=$(kubectl get svc -n envoy-gateway-system --selector=gateway.envoyproxy.io/owning-gateway-name=eg -o jsonpath='{.items[0].status.loadBalancer.ingress[0].ip}')
# curl http://$GTW_IP/mirror
#
# infra-backend-v1 handles the response; infra-backend-v2 receives a mirrored copy of the request
# (check its logs to confirm): kubectl logs -l app=infra-backend-v2 -f
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: request-mirror
spec:
  parentRefs:
    - name: eg
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mirror
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: infra-backend-v2
              port: 8080
      backendRefs:
        - name: infra-backend-v1
          port: 8080
