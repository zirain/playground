# gateway-tls.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: apiserver-gateway
  namespace: default
spec:
  gatewayClassName: eg
  listeners:
    - name: tls-passthrough
      protocol: TLS
      port: 6443
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: Same
---
# tlsroute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: apiserver-route
  namespace: default
spec:
  parentRefs:
    - name: apiserver-gateway
  rules:
    - backendRefs:
        - name: kubernetes
          port: 443
