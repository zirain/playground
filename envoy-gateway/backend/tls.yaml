metadata:
  name: backend-tls-2
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: backend-tls-2
    - group: gateway.envoyproxy.io
      kind: Backend
      name: backend-tls-2-ip
  validation:
    caCertificateRefs:
      - name: example-ca
        group: ""
        kind: ConfigMap
    hostname: www.example.com
---
apiVersion: v1
kind: Service
metadata:
  name: tls-backend-2
spec:
  selector:
    app: tls-backend-2
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: 8443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tls-backend-2
  labels:
    app: tls-backend-2
spec:
  replicas: 1
  selector:
    matchLabels:
