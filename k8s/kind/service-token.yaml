# sa-admin.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sa-admin-user
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sa-admin-user-binding
subjects:
  - kind: ServiceAccount
    name: sa-admin-user
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: cluster-admin # change this to a more restrictive role if needed
  apiGroup: rbac.authorization.k8s.io
# kubectl create token sa-admin-user -n kube-system --duration=8760h