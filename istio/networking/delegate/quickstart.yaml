apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: httpbin-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: httpbin-root
  namespace: default
spec:
  gateways:
    - httpbin-gateway
  hosts:
    - "*"
  http:
    - match:
        - uri:
            prefix: /
      delegate:
        name: httpbin
        namespace: default
    - match:
        - uri:
            exact: /status
      delegate:
        name: httpbin
        namespace: default
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: httpbin
  namespace: default
spec:
  http:
    - match:
        - uri:
            exact: /status
      route:
        - destination:
            host: httpbin
            port:
              number: 8000
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: httpbin
            port:
              number: 8000
