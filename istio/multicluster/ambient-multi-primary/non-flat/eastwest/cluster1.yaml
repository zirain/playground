# One east-west gateway for both data planes. Istio 1.32+ only (istio/istio#62442):
# HBONE on 15008 for ambient (ztunnel), and mTLS AUTO_PASSTHROUGH on 15443 for sidecars.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: istio-eastwestgateway
  namespace: istio-system
  labels:
    topology.istio.io/network: network1
spec:
  gatewayClassName: istio-east-west
  listeners:
    - name: mesh
      port: 15008
      protocol: HBONE
      tls:
        mode: Terminate # represents double-HBONE
        options:
          gateway.istio.io/tls-terminate-mode: ISTIO_MUTUAL
    - name: cross-network
      port: 15443
      protocol: TLS
      tls:
        mode: Passthrough
