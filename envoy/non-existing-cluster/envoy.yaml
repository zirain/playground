static_resources:
  listeners:
    - name: listener_http
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "[%START_TIME%] \"%REQ(:METHOD)% %REQ(:PATH)%\" %RESPONSE_CODE% %RESPONSE_FLAGS% %RESPONSE_CODE_DETAILS% cluster=%UPSTREAM_CLUSTER%\n"
                route_config:
                  name: local_route
                  # Static route configs validate that every referenced cluster exists
                  # by default; disable it so Envoy starts with a dangling cluster ref.
                  validate_clusters: false
                  virtual_hosts:
                    - name: backend
                      domains:
                        - "*"
                      routes:
                        # Override the status code returned when the cluster is not found.
                        - match:
                            prefix: "/missing-404"
                          route:
                            cluster: non-existing-cluster
                            cluster_not_found_response_code: NOT_FOUND
                        # Default behavior: 503 with response flag NC (no cluster).
                        - match:
                            prefix: "/missing"
                          route:
                            cluster: non-existing-cluster
                        # Same as /weighted, but the missing share returns 500 instead of 503.
                        # Must come before /weighted so the longer prefix matches first.
                        - match:
                            prefix: "/weighted-500"
                          route:
                            weighted_clusters:
                              clusters:
                                - name: existing-cluster
                                  weight: 50
                                - name: non-existing-cluster
                                  weight: 50
                            cluster_not_found_response_code: INTERNAL_SERVER_ERROR
                        # Weighted clusters: the cluster is picked per request first, then
                        # looked up. Requests landing on the missing one get 503 NC; the rest succeed.
                        - match:
                            prefix: "/weighted"
                          route:
                            weighted_clusters:
                              clusters:
                                - name: existing-cluster
                                  weight: 50
                                - name: non-existing-cluster
                                  weight: 50
                        # Cluster name taken from a request header; unknown names -> NC.
                        - match:
                            prefix: "/header"
                          route:
                            cluster_header: x-cluster
                        - match:
                            prefix: "/"
                          route:
                            cluster: existing-cluster
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # Simple upstream listener backing existing-cluster.
    - name: listener_upstream
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 10001
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: upstream_http
                route_config:
                  name: upstream_route
                  virtual_hosts:
                    - name: upstream
                      domains:
                        - "*"
                      routes:
                        - match:
                            prefix: "/"
                          direct_response:
                            status: 200
                            body:
                              inline_string: "hello from existing-cluster\n"
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: existing-cluster
      connect_timeout: 1s
      type: STATIC
      load_assignment:
        cluster_name: existing-cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 10001

admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 15000
