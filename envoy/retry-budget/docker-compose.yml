services:
  envoy:
    image: envoyproxy/envoy:distroless-dev
    command:
      [
        "-c",
        "/etc/envoy/envoy.yaml",
        "--component-log-level",
        "upstream:debug",
      ]
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "10000:10000"
      - "9901:9901"
    networks:
      - envoymesh

  echo1:
    image: registry.k8s.io/gateway-api/echo-basic:v1.5.1
    environment:
      - SERVICE_NAME=echo1
    networks:
      - envoymesh

  echo2:
    image: registry.k8s.io/gateway-api/echo-basic:v1.5.1
    environment:
      - SERVICE_NAME=echo2
    networks:
      - envoymesh

  echo3:
    image: registry.k8s.io/gateway-api/echo-basic:v1.5.1
    environment:
      - SERVICE_NAME=echo3
    networks:
      - envoymesh

  echo4:
    image: registry.k8s.io/gateway-api/echo-basic:v1.5.1
    environment:
      - SERVICE_NAME=echo4
    networks:
      - envoymesh

networks:
  envoymesh:
    driver: bridge
