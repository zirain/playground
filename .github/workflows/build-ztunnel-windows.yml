name: Build ztunnel Windows image

on:
  workflow_dispatch:
    inputs:
      ztunnel_ref:
        description: "istio/ztunnel branch/tag/sha to build"
        required: false
        default: experimental-windows-ambient
      image_tag:
        description: "Extra floating tag to push (in addition to the commit sha). Defaults to the commit sha if left blank."
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/zirain/ztunnel-windows

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout istio/ztunnel
        uses: actions/checkout@v4
        with:
          repository: istio/ztunnel
          ref: ${{ inputs.ztunnel_ref }}

      - name: Resolve commit sha
        id: rev
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve extra tag
        id: extra_tag
        run: echo "tag=${INPUT_IMAGE_TAG:-$SHA}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          SHA: ${{ steps.rev.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          name: windows-builder
          platforms: windows/amd64

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile.ztunnel-windows cross-compiles ztunnel.exe on a Linux
      # build stage (--platform=$BUILDPLATFORM) and only COPYs it into the
      # Windows base image in the final stage, so this builds fine with a
      # regular Linux buildx builder - no Windows runner needed.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ztunnel-windows
          builder: windows-builder
          platforms: windows/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.extra_tag.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.rev.outputs.sha }}
